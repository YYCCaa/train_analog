# UI / validation metadata for every key in v7_default.yaml.
# Leaf = {type, min, max, step, help, readonly?}. For *_range types, min/max
# bound BOTH ends of the range. Bounds are physical limits that contain the
# default and keep render_image crash-free at any slider extreme (the
# canvas may exceed img_size; it is cropped to the image when placed).
# They also keep the tip label on the image for ANY combination of extremes:
# apex reach from the dial centre, after stretch, must fit the half image
# minus the largest displacement (shift of everything inside the
# always-centred circular boundary), i.e.
#   ((int(85*scale_max) - 2) * (1 + tip_variation_max) + |ptr_displacement|max)
#     * stretch_max <= 127 - |displacement|max
#   ((97 - 2) * 1.05 + 6) * 1.1 = 116.3 <= 127 - 10 = 117
# (pinned by tests/test_v7_render.py::test_render_extremes_do_not_crash).
# The bound still holds with cut_tip on: the visible-tip label sits closer to the centre than the apex.

canvas:
  img_size: {type: int, min: 256, max: 256, step: 1, readonly: true, help: "Output image side in px (fixed: training hard-codes 256)."}

dataset:
  angle_deg_range: {type: int_range, min: 0, max: 359, step: 1, help: "Pointer angle range in whole degrees (0 = up, clockwise)."}

geometry:
  scale_range: {type: float_range, min: 0.7, max: 1.15, step: 0.01, help: "Dial radius multiplier on img_size//3."}
  hub_ratio_range: {type: float_range, min: 0.2, max: 0.6, step: 0.01, help: "Hub radius as a fraction of dial radius."}
  chord_ratio_range: {type: float_range, min: 0.5, max: 1.0, step: 0.01, help: "Pointer base chord length / hub diameter."}
  hole_ratio_range: {type: float_range, min: 0.5, max: 1.5, step: 0.01, help: "Mounting hole radius / hub radius."}
  hole_disp_range: {type: float_range, min: -20.0, max: 20.0, step: 0.5, help: "Mounting hole offset from pointer centre (px)."}
  tip_variation: {type: float, min: 0.0, max: 0.05, step: 0.005, help: "Fractional jitter of pointer tip distance."}
  displacement_range: {type: float_range, min: -10.0, max: 10.0, step: 0.5, help: "Shift of everything inside the circular boundary (px); the boundary itself stays centred and its outside is black."}
  ptr_displacement_range: {type: float_range, min: -6.0, max: 6.0, step: 0.5, help: "Pointer + hole offset from dial centre (px)."}
  stretch_h_range: {type: float_range, min: 0.8, max: 1.1, step: 0.01, help: "Horizontal stretch factor inside the dial."}
  stretch_v_range: {type: float_range, min: 0.8, max: 1.1, step: 0.01, help: "Vertical stretch factor inside the dial."}
  canvas_margin: {type: int, min: 10, max: 30, step: 1, help: "Minimum px beyond the dial radius in the canvas."}
  arc_gap_range: {type: float_range, min: 0.0, max: 350.0, step: 1, help: "Arc gap width on the dial circle and its shadow (degrees)."}

outer:
  scale_range: {type: float_range, min: 1.05, max: 1.4, step: 0.01, help: "Outer boundary radius / dial radius."}
  rim_width: {type: int, min: 0, max: 10, step: 1, help: "Rim band thickness (px)."}

ticks:
  per_digit_range: {type: int_range, min: 1, max: 10, step: 1, help: "Subdivision ticks between consecutive digits."}
  angle_jitter_range: {type: float_range, min: -10.0, max: 10.0, step: 0.1, help: "Shared angular offset of all ticks (degrees)."}
  len_range: {type: int_range, min: 1, max: 20, step: 1, help: "Major tick length (px); minor ticks are half."}
  width_range: {type: int_range, min: 1, max: 8, step: 1, help: "Major tick width (px); minor = max(1, width-1)."}
  gray_range: {type: int_range, min: 0, max: 255, step: 1, help: "Tick gray level (0 = black)."}

digits:
  outside_jitter_range: {type: float_range, min: 0.0, max: 10.0, step: 0.1, help: "Outward-only radial jitter of digits placed outside the ticks (px)."}
  inside_jitter_range: {type: float_range, min: 0.0, max: 10.0, step: 0.1, help: "Inward-only radial jitter of digits placed inside the ticks (px)."}
  angle_jitter_range: {type: float_range, min: 0.0, max: 10.0, step: 0.1, help: "Shared angular jitter of digits (degrees)."}
  font_size_range: {type: int_range, min: 8, max: 40, step: 1, help: "Digit font size (px)."}
  show_prob: {type: float, min: 0.0, max: 1.0, step: 0.05, help: "Probability that digits are drawn."}
  gray_range: {type: int_range, min: 0, max: 255, step: 1, help: "Digit gray level (0 = black)."}
  gap_range: {type: float_range, min: 0.0, max: 10.0, step: 0.1, help: "Clearance between digits and ticks (px)."}
  inside_prob: {type: float, min: 0.0, max: 1.0, step: 0.05, help: "Probability that digits sit inside the ticks."}

palette:
  bg_gray_range: {type: int_range, min: 0, max: 255, step: 1, help: "Background gray level."}
  circle_gray_range: {type: int_range, min: 0, max: 255, step: 1, help: "Faint dial circle gray level."}
  outer_gray_range: {type: int_range, min: 0, max: 255, step: 1, help: "Annulus between dial and bezel gray level."}
  rim_gray_range: {type: int_range, min: 0, max: 255, step: 1, help: "Rim band gray level."}

pointer:
  gray_range: {type: int_range, min: 0, max: 255, step: 1, help: "Pointer body gray level (uniform draw)."}
  darker_frac_range: {type: float_range, min: 0.0, max: 1.0, step: 0.01, help: "Hole/edge gray as a fraction of the pointer gray."}
  gradient_range: {type: float_range, min: -100.0, max: 100.0, step: 1, help: "Lengthwise brightness shift from hub to tip."}
  noise_amplitude: {type: int, min: 0, max: 64, step: 1, help: "Per-pixel noise amplitude on the pointer body (+/-)."}
  edge_thickness_range: {type: int_range, min: 0, max: 8, step: 1, help: "Pointer edge band width (px); 0 = no edge band."}
  edge_max_frac: {type: float, min: 0, max: 1, step: 0.01, help: "Max pointer edge band width as a fraction of the triangle's cross-section width at each height (1 = no clamp)."}
  edge_noise_amplitude: {type: int, min: 0, max: 32, step: 1, help: "Per-pixel noise amplitude on the pointer edge (+/-)."}
  min_bg_contrast: {type: int, min: 0, max: 255, step: 1, help: "Minimum |pointer gray − face gray|, for the bare face and the darkest shadowed face (the pointer gray is drawn after bg and shadow); 0 = off."}

background:
  lowfreq_size: {type: int, min: 2, max: 32, step: 1, help: "Low-frequency background tile resolution (NxN)."}
  variation: {type: int, min: 0, max: 64, step: 1, help: "Max deviation of the low-frequency tiles."}
  noise_intensity: {type: int, min: 0, max: 32, step: 1, help: "Per-pixel background noise amplitude (+/-)."}
  dial_circle_blur: {type: bool, min: 0, max: 1, step: 1, help: "Blur the region inside the dial circle."}
  dial_circle_blur_radius: {type: int, min: 1, max: 16, step: 1, help: "Gaussian blur radius inside the dial circle (px)."}

cut_tip:
  enabled: {type: bool, min: 0, max: 1, step: 1, help: "Erase pointer pixels within this radius of the apex; the tip label moves back to where the cut pointer still crosses more than tip_label.min_pixels pixels."}
  radius_range: {type: int_range, min: 1, max: 20, step: 1, help: "Radius of the erased circle around the apex (px)."}

tip_label:
  min_pixels: {type: int, min: 0, max: 30, step: 1, help: "Tip label = point on the pointer triangle's height nearest the apex where the line parallel to the base crosses more than this many pointer pixels."}

shadows:
  prob: {type: float, min: 0.0, max: 1.0, step: 0.05, help: "Probability of rendering pointer and rim shadows."}
  strength_range: {type: float_range, min: 0.0, max: 1.0, step: 0.01, help: "Shared shadow darkening fraction per image (0 = none, 1 = black); out = in x (1 - strength x shape)."}
  strength_jitter: {type: float, min: 0.0, max: 0.5, step: 0.01, help: "Per-shadow +/- jitter of the shared strength, drawn separately for the pointer and rim shadows."}
  offset_range: {type: float_range, min: 0.0, max: 40.0, step: 0.5, help: "Pointer shadow displacement (px)."}
  blur_radius: {type: float, min: 0.0, max: 10.0, step: 0.1, help: "Gaussian blur radius of the pointer shadow (px)."}
  rim_offset_frac: {type: float_range, min: 0.0, max: 0.6, step: 0.01, help: "Rim shadow crescent offset / dial radius."}
  rim_cutout_frac: {type: float_range, min: 0.5, max: 1.0, step: 0.01, help: "Rim shadow cutout radius / dial radius."}
  rim_blur_range: {type: float_range, min: 0.5, max: 20.0, step: 0.1, help: "Rim shadow blur radius (px)."}

reflections:
  prob: {type: float, min: 0.0, max: 1.0, step: 0.05, help: "Probability an image gets reflections."}
  count_range: {type: int_range, min: 0, max: 8, step: 1, help: "Reflections per image."}
  size_range: {type: int_range, min: 8, max: 256, step: 1, help: "Longest side of the glyph after scaling (px)."}
  rotation_range: {type: float_range, min: 0.0, max: 360.0, step: 1, help: "Random rotation of the glyph (degrees)."}
  aspect_range: {type: float_range, min: 0.1, max: 10.0, step: 0.05, help: "Width/height stretch, drawn log-uniform (1 = unchanged)."}
  shear_range: {type: float_range, min: -3.0, max: 3.0, step: 0.05, help: "Horizontal shear factor of the glyph."}
  perspective_range: {type: float_range, min: 0.0, max: 0.9, step: 0.01, help: "Projective keystone strength range, drawn per item (0 = affine only)."}
  warp_strength_range: {type: float_range, min: 0.0, max: 1.0, step: 0.01, help: "Elastic warp amplitude as a fraction of the glyph size, drawn per item (0 = rigid)."}
  warp_grid_range: {type: int_range, min: 2, max: 12, step: 1, help: "Warp control grid g (g × g), drawn per item; larger = finer, wigglier distortion."}
  darken_range: {type: int_range, min: 0, max: 255, step: 1, help: "Gray levels subtracted inside the shape (value, not multiplier)."}
  edge_soft: {type: float, min: 0, max: 5, step: 0.1, help: "Gaussian softening of the shape edge (px)."}

glares:
  prob: {type: float, min: 0.0, max: 1.0, step: 0.05, help: "Probability an image gets glares."}
  count_range: {type: int_range, min: 0, max: 8, step: 1, help: "Glares per image."}
  size_range: {type: int_range, min: 8, max: 256, step: 1, help: "Longest side of the glyph after scaling (px)."}
  rotation_range: {type: float_range, min: 0.0, max: 360.0, step: 1, help: "Random rotation of the glyph (degrees)."}
  aspect_range: {type: float_range, min: 0.1, max: 10.0, step: 0.05, help: "Width/height stretch, drawn log-uniform (1 = unchanged)."}
  shear_range: {type: float_range, min: -3.0, max: 3.0, step: 0.05, help: "Horizontal shear factor of the glyph."}
  perspective_range: {type: float_range, min: 0.0, max: 0.9, step: 0.01, help: "Projective keystone strength range, drawn per item (0 = affine only)."}
  warp_strength_range: {type: float_range, min: 0.0, max: 1.0, step: 0.01, help: "Elastic warp amplitude as a fraction of the glyph size, drawn per item (0 = rigid)."}
  warp_grid_range: {type: int_range, min: 2, max: 12, step: 1, help: "Warp control grid g (g × g), drawn per item; larger = finer, wigglier distortion."}
  value_range: {type: int_range, min: 0, max: 255, step: 1, help: "Gray level the glare overwrites pixels with (value, not multiplier)."}
  edge_soft: {type: float, min: 0, max: 5, step: 0.1, help: "Gaussian softening of the shape edge (px)."}
  clear_distance: {type: float, min: 0, max: 80, step: 0.5, help: "No glare within this distance of the visible pointer tip (px)."}

jitter:
  brightness_range: {type: float_range, min: 0.5, max: 2.0, step: 0.01, help: "ImageEnhance.Brightness factor (1 = unchanged)."}
  contrast_range: {type: float_range, min: 0.5, max: 1.5, step: 0.01, help: "ImageEnhance.Contrast factor (1 = unchanged)."}
  sharpness_range: {type: float_range, min: 0.0, max: 3.0, step: 0.01, help: "ImageEnhance.Sharpness factor (1 = unchanged)."}

hier_noise:
  blocks: {type: int, min: 1, max: 16, step: 1, help: "Coarse noise grid size (NxN blocks)."}
  block_variance: {type: int, min: 0, max: 64, step: 1, help: "Per-block noise amplitude (+/-)."}
  pixel_variance: {type: int, min: 0, max: 32, step: 1, help: "Per-pixel noise amplitude (+/-)."}

tri_artifacts:
  enabled: {type: bool, min: 0, max: 1, step: 1, help: "Draw adversarial triangle artifacts."}
  count_range: {type: int_range, min: 0, max: 20, step: 1, help: "Triangles per image."}
  size_range: {type: int_range, min: 3, max: 80, step: 1, help: "Triangle base length (px)."}
  gray_range: {type: int_range, min: 0, max: 255, step: 1, help: "Triangle mean gray level."}
  pixel_var: {type: int, min: 0, max: 32, step: 1, help: "Per-pixel noise around the triangle mean (+/-)."}
  vertex_dist_range: {type: float_range, min: 0.1, max: 1.5, step: 0.01, help: "Vertex distance as a fraction of the triangle size."}
