# Default render parameters for generate_synthetic_v7_mp.py (native grayscale).
# Values only; slider bounds / help text live in v7_schema.yaml.
# Every key here has a schema entry, a UI control, and changes the output.
# Section names are also the RNG stream names (plus "angle").
#
# Dropped constants from the old luma-port v7 (not parameters any more):
#   BLUR_RANGE                   never used by the render (dead)
#   RIM_SHADOW_SECONDARY_OPACITY never used by the render (dead)
#   VALUE_MIN, VALUE_MAX         never used by the render (dead)
#   CENTER, DIAL_RADIUS_BASE,
#   DIGIT_DIST                   derived from img_size / unreachable fallback
#   SATURATION_RANGE             ImageEnhance.Color has no meaning in gray
#   DIAL_S_RANGE, SHADOW_S_RANGE,
#   all hue draws                gray has no hue or saturation
#   augment=False code path      the CLI never used it
# Gray defaults below were derived by sampling 100k draws of each old colour
# recipe (commit 69b4769), converting to ITU-R 601 luma and taking [p1, p99].

canvas:
  img_size: 256  # int scalar; output side (px); read-only, training hard-codes 256

dataset:
  angle_deg_range: [0, 359]  # [lo, hi] int; pointer angle, integer degrees (0 = up, clockwise)

geometry:
  scale_range: [0.9, 1.1]  # [lo, hi] float; dial radius multiplier on img_size//3
  hub_ratio_range: [0.4, 0.45]  # [lo, hi] float; hub radius / dial radius
  chord_ratio_range: [0.99, 1.0]  # [lo, hi] float; pointer base chord / hub diameter
  hole_ratio_range: [1.05, 1.08]  # [lo, hi] float; mounting hole radius / hub radius
  hole_disp_range: [-8.0, 8.0]  # [lo, hi] float; mounting hole offset from pointer centre (px)
  tip_variation: 0.02  # float scalar; fractional jitter of tip distance
  displacement_range: [-3.0, 3.0]  # [lo, hi] float; shift of everything inside the circular boundary (px); the boundary itself stays centred and its outside is black
  ptr_displacement_range: [-5.0, 5.0]  # [lo, hi] float; pointer+hole offset from dial centre (px)
  stretch_h_range: [0.98, 1.02]  # [lo, hi] float; horizontal stretch inside dial
  stretch_v_range: [0.98, 1.02]  # [lo, hi] float; vertical stretch inside dial
  canvas_margin: 30  # int scalar; min px beyond dial radius in the canvas
  arc_gap_range: [50.0, 120.0]  # [lo, hi] float; arc gap width on dial circle / shadow (deg)

outer:
  scale_range: [1.25, 1.32]  # [lo, hi] float; outer boundary radius / dial radius
  rim_width: 3  # int scalar; rim band thickness (px)

ticks:
  per_digit_range: [1, 5]  # [lo, hi] int; subdivision ticks between digits
  angle_jitter_range: [-4.0, 4.0]  # [lo, hi] float; shared angular offset of all ticks (deg)
  len_range: [6, 9]  # [lo, hi] int; major tick length (px); minor = half
  width_range: [2, 4]  # [lo, hi] int; major tick width (px); minor = max(1, w-1)
  gray_range: [0, 30]  # [lo, hi] int; tick gray level (already gray in old code)

digits:
  outside_jitter_range: [0.0, 4.0]  # [lo, hi] float; outward-only radial jitter of outside digits (px)
  inside_jitter_range: [0.0, 4.0]  # [lo, hi] float; inward-only radial jitter of inside digits (px)
  angle_jitter_range: [0.0, 2.0]  # [lo, hi] float; shared angular jitter (deg)
  font_size_range: [16, 26]  # [lo, hi] int; digit font size (px)
  show_prob: 0.5  # float scalar; probability digits are drawn
  gray_range: [0, 30]  # [lo, hi] int; digit gray level (already gray in old code)
  gap_range: [0.0, 1.0]  # [lo, hi] float; clearance between digits and ticks (px)
  inside_prob: 0.5  # float scalar; probability digits sit inside the ticks

palette:
  bg_gray_range: [154, 179]  # [lo, hi] int; from HSV V 0.67-0.71, S 0-0.15: luma p1-p99
  circle_gray_range: [193, 222]  # [lo, hi] int; from HSV V 0.84-0.88, S 0-0.15: luma p1-p99
  outer_gray_range: [183, 222]  # [lo, hi] int; luma p1-p99 of HSV V 0.76-0.86, S 0-0.15 ([177, 216]) raised +6 to match old bezel-ring mean (compare_v7_look)
  rim_gray_range: [170, 197]  # [lo, hi] int; luma p1-p99 of HSV V 0.71-0.76, S 0-0.15 ([164, 191]) raised +6 to match old bezel-ring mean (compare_v7_look)

pointer:
  gray_range: [0, 255]  # [lo, hi] int; user decision: uniform 0-255 (old: HSV all uniform, luma p1-p99 = 1-232)
  darker_frac_range: [0.4, 0.6]  # [lo, hi] float; hole/edge gray = fraction of pointer gray
  gradient_range: [-25.0, 25.0]  # [lo, hi] float; lengthwise brightness shift hub-to-tip
  noise_amplitude: 25  # int scalar; per-pixel noise amplitude on body (+/-)
  edge_thickness_range: [1, 3]  # [lo, hi] int; edge band width (px)
  edge_noise_amplitude: 5  # int scalar; per-pixel noise amplitude on edge (+/-)
  min_bg_contrast: 0  # int scalar; min |pointer gray - bg gray| (bg_gray_range draw); 0 = off

background:
  lowfreq_size: 8  # int scalar; low-frequency gradient tile resolution (NxN)
  variation: 8  # int scalar; max deviation of the low-freq tiles
  noise_intensity: 3  # int scalar; per-pixel noise amplitude (+/-)
  dial_circle_blur: true  # bool; blur inside the dial circle
  dial_circle_blur_radius: 3  # int scalar; that blur radius (px)

cut_tip:
  enabled: true  # bool; erase pointer pixels near the apex; tip label = farthest point on the axis where the pointer is still wide enough to see after blur (edge ring, cut and rim aware)
  radius_range: [7, 10]  # [lo, hi] int; erased radius (px)

tip_label:
  # label = farthest axis point p where Cmap = G_sigma_eff * (visible pointer weight) has Cmap(p) >= c
  # and >= min_ratio of the patch_size x patch_size square around p has Cmap >= c;
  # sigma_eff = sqrt(sigma_blur^2 + base_blur^2), sigma_blur = dial_circle_blur_radius when the blur is on
  contrast_frac: 0.5  # float scalar; c, per-pixel fraction of the pointer contrast left after the blur
  base_blur: 1.0  # float scalar; observer blur sigma_0 (px) added in quadrature to the dial blur
  patch_size: 9  # int scalar; side (px, odd) of the square patch centred on the tip that must support it
  min_ratio: 0.2  # float scalar; min share of that patch with Cmap >= contrast_frac (0 = off)

shadows:
  # physical model: out = in x (1 - d), d = max(s_p x pointer shape, s_r x rim shape)
  prob: 0.5  # float scalar; probability of pointer + rim shadows
  strength_range: [0.50, 0.62]  # [lo, hi] float; shared darkening fraction s per image (0 = none, 1 = black)
  strength_jitter: 0.05  # float scalar; per-shadow +/- jitter of s, drawn separately for pointer and rim
  offset_range: [15.0, 25.0]  # [lo, hi] float; pointer shadow displacement (px)
  blur_radius: 2.5  # float scalar; pointer shadow Gaussian blur (px)
  rim_offset_frac: [0.15, 0.35]  # [lo, hi] float; crescent offset / dial radius
  rim_cutout_frac: [0.8, 0.95]  # [lo, hi] float; crescent cutout radius / dial radius
  rim_blur_range: [4.0, 8.0]  # [lo, hi] float; rim shadow blur radius (px)

reflections:
  # cover-glass reflections: shape = an ASCII glyph (A-Z a-z 0-9, random font), randomly
  # scaled / rotated / stretched / sheared / keystoned / elastically warped; out = in - darken x shape
  prob: 0.0  # float scalar; probability an image gets reflections (0 = off)
  count_range: [1, 3]  # [lo, hi] int; reflections per image
  size_range: [24, 96]  # [lo, hi] int; longest side of the glyph after scaling (px)
  rotation_range: [0.0, 360.0]  # [lo, hi] float; random rotation of the glyph (deg)
  aspect_range: [0.25, 4.0]  # [lo, hi] float; width/height stretch, drawn log-uniform (1 = unchanged)
  shear_range: [-1.0, 1.0]  # [lo, hi] float; horizontal shear factor of the glyph
  perspective_range: [0.0, 0.4]  # [lo, hi] float; projective keystone strength, drawn per item (0 = affine only)
  warp_strength_range: [0.05, 0.2]  # [lo, hi] float; elastic warp amplitude as a fraction of the glyph size, drawn per item (0 = rigid)
  warp_grid_range: [3, 6]  # [lo, hi] int; warp control grid g (g x g), drawn per item; larger = finer, wigglier distortion
  darken_range: [10, 40]  # [lo, hi] int; gray levels subtracted inside the shape (value, not multiplier)
  edge_soft: 1.5  # float scalar; Gaussian softening of the shape edge (px)

glares:
  # cover-glass glares: shape as above; out = lerp(in, value, shape), applied after reflections
  prob: 0.0  # float scalar; probability an image gets glares (0 = off)
  count_range: [1, 2]  # [lo, hi] int; glares per image
  size_range: [16, 72]  # [lo, hi] int; longest side of the glyph after scaling (px)
  rotation_range: [0.0, 360.0]  # [lo, hi] float; random rotation of the glyph (deg)
  aspect_range: [0.25, 4.0]  # [lo, hi] float; width/height stretch, drawn log-uniform (1 = unchanged)
  shear_range: [-1.0, 1.0]  # [lo, hi] float; horizontal shear factor of the glyph
  perspective_range: [0.0, 0.4]  # [lo, hi] float; projective keystone strength, drawn per item (0 = affine only)
  warp_strength_range: [0.05, 0.2]  # [lo, hi] float; elastic warp amplitude as a fraction of the glyph size, drawn per item (0 = rigid)
  warp_grid_range: [3, 6]  # [lo, hi] int; warp control grid g (g x g), drawn per item; larger = finer, wigglier distortion
  value_range: [220, 255]  # [lo, hi] int; gray level the glare overwrites pixels with (value, not multiplier)
  edge_soft: 1.0  # float scalar; Gaussian softening of the shape edge (px)
  clear_distance: 12.0  # float scalar; no glare within this distance of the visible pointer tip (px)

jitter:
  brightness_range: [0.95, 1.35]  # [lo, hi] float; ImageEnhance.Brightness factor
  contrast_range: [0.8, 1.2]  # [lo, hi] float; ImageEnhance.Contrast factor
  sharpness_range: [0.7, 1.5]  # [lo, hi] float; ImageEnhance.Sharpness factor

hier_noise:
  blocks: 5  # int scalar; coarse noise grid (NxN blocks)
  block_variance: 15  # int scalar; per-block amplitude (+/-)
  pixel_variance: 3  # int scalar; per-pixel amplitude (+/-)

tri_artifacts:
  enabled: true  # bool; master toggle
  count_range: [0, 6]  # [lo, hi] int; triangles per image
  size_range: [15, 40]  # [lo, hi] int; triangle base length (px)
  gray_range: [65, 184]  # [lo, hi] int; from 3 channel means randint(50,200) -> luma p1-p99
  pixel_var: 5  # int scalar; per-pixel noise around the mean (+/-)
  vertex_dist_range: [0.3, 1.0]  # [lo, hi] float; vertex distance / size
